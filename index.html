
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your account using our simple and secure signup form.">
    <meta name="theme-color" content="#5b4bdb">
    <title>Create Account | Signup Form</title>

    <link rel="icon" type="image/svg+xml" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#" aria-label="Create Account home">
            <span class="brand-icon">S</span>
            <span>SignUp</span>
        </a>
        <p>Already have an account? <a href="#signup-form">Sign up</a></p>
    </header>

    <main class="page-container">
        <section class="signup-card" aria-labelledby="page-title">
            <div class="intro">
                <span class="eyebrow">GET STARTED FOR FREE</span>
                <h1 id="page-title">Create your account</h1>
                <p>Join us today. It only takes a few minutes.</p>
            </div>

            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                        aria-describedby="email-error"
                    >
                    <small class="field-error" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        aria-describedby="password-help password-error"
                    >
                    <small class="field-help" id="password-help">
                        Use 8+ characters with uppercase, lowercase, a number and a symbol.
                    </small>
                    <small class="field-error" id="password-error"></small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                        aria-describedby="confirm-error"
                    >
                    <small class="field-error" id="confirm-error"></small>
                </div>

                <div class="form-group">
                    <label for="dob">Date of birth</label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        autocomplete="bday"
                        required
                        aria-describedby="dob-error"
                    >
                    <small class="field-error" id="dob-error"></small>
                </div>

                <fieldset class="form-group gender-group">
                    <legend>Gender</legend>
                    <div class="radio-options">
                        <label class="choice">
                            <input type="radio" name="gender" value="Male" required>
                            <span>Male</span>
                        </label>
                        <label class="choice">
                            <input type="radio" name="gender" value="Female" required>
                            <span>Female</span>
                        </label>
                        <label class="choice">
                            <input type="radio" name="gender" value="Other" required>
                            <span>Other</span>
                        </label>
                    </div>
                    <small class="field-error" id="gender-error"></small>
                </fieldset>

                <div class="terms-row">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the <a href="#terms-note">Terms and Conditions</a>.
                    </label>
                </div>
                <small class="field-error" id="terms-error"></small>

                <button type="submit" id="submit-btn">Create Account</button>

                <div id="form-feedback" class="feedback" role="status"
                     aria-live="polite" tabindex="-1" hidden></div>
            </form>

            <p class="privacy-note" id="terms-note">
                Your information should be kept safe and secure.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="year">2026</span> SignUp. All rights reserved.</p>
    </footer>
</body>
</html>
